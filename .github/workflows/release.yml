name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches version
        shell: pwsh
        run: |
          $propVersion = (Select-String -Path gradle.properties -Pattern '^version=(.+)$').Matches.Groups[1].Value.Trim()
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($propVersion -ne $tagVersion) {
            Write-Error "标签 ${{ github.ref_name }} 与 gradle.properties 的 version=$propVersion 不一致"
            exit 1
          }

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle with cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        shell: pwsh
        run: ./gradlew buildPlugin --console=plain "-Dorg.gradle.java.home=$env:JAVA_HOME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
          generate_release_notes: true
