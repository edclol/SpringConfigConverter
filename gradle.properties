group=com.edc
version=2.0.1
# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false
# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=false
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# Fix TLS handshake issues - use Windows certificate store
systemProp.javax.net.ssl.trustStoreType=Windows-ROOT
org.gradle.jvmargs=-Djavax.net.ssl.trustStoreType=Windows-ROOT -Dhttps.protocols=TLSv1.2,TLSv1.3
# Specify Java Home for Gradle (use bundled JDK or system JDK 17+)
org.gradle.java.home=D:\\jdk\\jdk-21.0.11
